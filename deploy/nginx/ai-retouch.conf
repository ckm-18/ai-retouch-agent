# AI 修图智能体 - Nginx 反向代理配置
# 部署：复制到 /etc/nginx/sites-available/ai-retouch 后
#   ln -s /etc/nginx/sites-available/ai-retouch /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# 把 your-domain.com 替换为实际域名；没有域名时填服务器公网 IP。

server {
    listen 80;
    server_name your-domain.com;

    # API 和前端页面（后端 7302 已同源托管前端静态文件）
    location / {
        proxy_pass http://127.0.0.1:7302;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 必须关闭缓冲，否则修图进度推送会被攒批发
        proxy_buffering off;
        proxy_cache off;
        # SSE 长连接超时延长到 10 分钟
        proxy_read_timeout 600s;
    }

    # MinIO 对象存储代理（不想单独暴露 7313 端口时启用）
    # 启用后 .env 中设置 S3_PUBLIC_ENDPOINT=http://your-domain.com/s3
    location /s3/ {
        proxy_pass http://127.0.0.1:7313/;
        proxy_set_header Host $host;
    }
}
